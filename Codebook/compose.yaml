services:
  postgres:
    image: postgres:16
    container_name: climate-visu-postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - climate_visu_data:/var/lib/postgresql/data
      - ./init/createDB.sql:/docker-entrypoint-initdb.d/01-createDB.sql:ro
    # Localhost-only by default. Remote access must be explicitly configured
    # with the Inria administrator after network/security requirements are confirmed.
    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  climate_visu_data:
